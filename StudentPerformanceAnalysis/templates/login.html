
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Portal</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8efff, #f8faff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            width: 360px;
            max-width: 85%;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 30px #00000015;
        }
        h1 { color: #183b70; font-size: 25px; }
        p { color: #667085; margin-bottom: 28px; }
        a {
            display: block;
            text-decoration: none;
            background: #2457c5;
            color: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 9px;
            font-weight: bold;
        }
        a:hover { background: #173f98; }
        .student { background: #12806a; }
        .student:hover { background: #086653; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Performance Portal</h1>
        <p>Please select your login type</p>

        <a href="{{ url_for('role_login', role='admin') }}">
            Staff / Admin Login
        </a>

        <a class="student" href="{{ url_for('role_login', role='student') }}">
            Student / Parent Login
        </a>
    </div>
</body>
</html>
